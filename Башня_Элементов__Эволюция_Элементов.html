<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Башня Элементов: Эволюция Элементов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Яндекс Игры SDK -->
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background: #0f0c20;
            overflow: hidden;
        }

        .font-game {
            font-family: 'Fredoka One', cursive;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glow-button {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glow-button:active {
            transform: scale(0.92);
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }
            50% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.8); }
        }

        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }

        /* Тряска экрана */
        .shake {
            animation: shakeAnim 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeAnim {
            10%, 90% { transform: translate3d(-2px, 1px, 0); }
            20%, 80% { transform: translate3d(3px, -2px, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 3px, 0); }
            40%, 60% { transform: translate3d(5px, -3px, 0); }
        }

        /* Анимация всплывающих очков */
        .score-popup {
            position: absolute;
            pointer-events: none;
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            font-weight: bold;
            color: #facc15;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 10px rgba(250, 204, 21, 0.5);
            animation: floatUp 0.8s ease-out forwards;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
            50% { transform: translate(-50%, -100%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white select-none">

    <!-- Главный контейнер игры -->
    <div id="game-app" class="relative w-full max-w-md h-screen max-h-[920px] flex flex-col justify-between p-3 box-border overflow-hidden">
        
        <!-- Верхняя панель (Счет, Статистика, Следующий шар) -->
        <header class="w-full flex items-center justify-between z-20 gap-2 mt-1">
            <!-- Счет и Рекорд -->
            <div class="glass-panel px-4 py-2 rounded-2xl flex-1 flex flex-col justify-center">
                <span class="text-xs text-purple-300 font-bold tracking-wider uppercase">Счет</span>
                <span id="score-text" class="text-2xl font-game text-yellow-400 leading-none">0</span>
                <div class="flex items-center gap-1 mt-1 text-[10px] text-gray-300">
                    <span>Рекорд:</span>
                    <span id="best-score-text" class="font-bold text-white">0</span>
                </div>
            </div>

            <!-- Предпросмотр следующего шара -->
            <div class="glass-panel p-2 rounded-2xl flex flex-col items-center justify-center w-20 h-20 relative">
                <span class="text-[10px] text-purple-300 font-bold uppercase mb-1">След.</span>
                <div id="next-ball-preview" class="w-10 h-10 flex items-center justify-center relative"></div>
            </div>

            <!-- Кнопки Меню / Звук -->
            <div class="flex flex-col gap-2">
                <button id="sound-btn" class="glass-panel w-10 h-10 rounded-xl flex items-center justify-center glow-button hover:bg-white/10">
                    <svg id="sound-icon-on" class="w-5 h-5 text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                    <svg id="sound-icon-off" class="w-5 h-5 text-red-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
                </button>
                <button id="info-btn" class="glass-panel w-10 h-10 rounded-xl flex items-center justify-center glow-button hover:bg-white/10">
                    <span class="font-game text-purple-300 text-lg">?</span>
                </button>
            </div>
        </header>

        <!-- Игровой холст (Canvas Container) -->
        <main id="canvas-container" class="relative flex-1 w-full my-2 rounded-3xl overflow-hidden glass-panel border-2 border-purple-500/30 flex items-center justify-center">
            <!-- Линия предупреждения переполнения -->
            <div id="danger-line" class="absolute left-0 right-0 top-[80px] border-b-2 border-dashed border-red-500/60 pointer-events-none z-10 hidden flex items-center justify-end pr-2">
                <span class="text-[10px] text-red-400 bg-red-950/80 px-2 py-0.5 rounded-full font-bold animate-pulse">ОПАСНОСТЬ!</span>
            </div>

            <!-- Комбо индикатор -->
            <div id="combo-display" class="absolute top-4 left-4 font-game text-3xl text-amber-300 opacity-0 pointer-events-none z-20 transition-opacity duration-200">
                COMBO x<span id="combo-count">2</span>!
            </div>

            <canvas id="game-canvas" class="w-full h-full block"></canvas>
        </main>

        <!-- Нижняя панель с бустерами -->
        <footer class="w-full glass-panel p-2.5 rounded-2xl flex justify-around items-center z-20 mb-1">
            <!-- Бустер 1: Бомба -->
            <button id="booster-bomb" class="flex flex-col items-center glow-button group relative">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-red-500 to-orange-600 flex items-center justify-center shadow-lg group-active:scale-95 border border-red-300/30">
                    <span class="text-2xl">💣</span>
                </div>
                <span class="text-[10px] font-bold text-gray-200 mt-1">Взрыв</span>
                <span id="badge-bomb" class="absolute -top-1 -right-1 bg-yellow-400 text-black font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">1</span>
            </button>

            <!-- Бустер 2: Перемешивание -->
            <button id="booster-shake" class="flex flex-col items-center glow-button group relative">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg group-active:scale-95 border border-blue-300/30">
                    <span class="text-2xl">🌪️</span>
                </div>
                <span class="text-[10px] font-bold text-gray-200 mt-1">Микс</span>
                <span id="badge-shake" class="absolute -top-1 -right-1 bg-yellow-400 text-black font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">1</span>
            </button>

            <!-- Бустер 3: Смена текущей сферы -->
            <button id="booster-swap" class="flex flex-col items-center glow-button group relative">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg group-active:scale-95 border border-emerald-300/30">
                    <span class="text-2xl">🔄</span>
                </div>
                <span class="text-[10px] font-bold text-gray-200 mt-1">Замена</span>
                <span id="badge-swap" class="absolute -top-1 -right-1 bg-yellow-400 text-black font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">2</span>
            </button>
        </footer>

        <!-- Модальное окно: Проигрыш -->
        <div id="game-over-modal" class="absolute inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-6 text-center">
            <div class="glass-panel p-6 rounded-3xl w-full max-w-xs border-2 border-purple-500/50 flex flex-col items-center shadow-2xl">
                <div class="text-5xl mb-2 animate-bounce">💥</div>
                <h2 class="text-2xl font-game text-red-400 mb-1">СТАКАН ПЕРЕПОЛНЕН!</h2>
                <p class="text-sm text-gray-300 mb-4">Стихии вырвались из-под контроля</p>

                <div class="bg-black/40 w-full rounded-2xl p-4 mb-5 border border-white/10">
                    <div class="text-xs text-gray-400 uppercase font-bold mb-1">Итоговый результат</div>
                    <div id="final-score" class="text-4xl font-game text-yellow-400 mb-2">0</div>
                    <div class="text-xs text-purple-300 flex justify-between px-4">
                        <span>Лучший результат:</span>
                        <span id="final-best-score" class="font-bold text-white">0</span>
                    </div>
                </div>

                <!-- Смотреть рекламу для продолжения -->
                <button id="revive-btn" class="w-full py-3 mb-2 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-black tracking-wider uppercase shadow-lg glow-button flex items-center justify-center gap-2">
                    <span>🎬 Спастись (+2 Бомбы)</span>
                </button>

                <!-- Играть заново -->
                <button id="restart-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold tracking-wider uppercase shadow-lg glow-button border border-purple-400/30">
                    Заново
                </button>
            </div>
        </div>

        <!-- Модальное окно: Инструкция / Эволюция -->
        <div id="info-modal" class="absolute inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4">
            <div class="glass-panel p-5 rounded-3xl w-full max-w-sm border-2 border-purple-500/50 flex flex-col items-center">
                <h3 class="text-xl font-game text-yellow-400 mb-3">Дерево Эволюции</h3>
                <div id="evolution-list" class="w-full max-h-60 overflow-y-auto pr-1 flex flex-col gap-2 mb-4">
                    <!-- Заполняется динамически -->
                </div>
                <button id="close-info-btn" class="w-full py-2.5 rounded-xl bg-purple-600 font-bold hover:bg-purple-500 transition">Понятно!</button>
            </div>
        </div>

    </div>

    <script>
        /* =========================================================================
           ЗВУКОВОЙ ДВИЖОК (Web Audio API)
           ========================================================================= */
        class AudioController {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPop(size = 1) {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                const freq = 600 - (size * 35);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(Math.max(120, freq), this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(Math.max(80, freq * 1.8), this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.09);
            }

            playMerge(level = 0) {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                const baseFreq = 220 * Math.pow(1.15, level);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, this.ctx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playExplode() {
                if (this.muted) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        const audio = new AudioController();

        /* =========================================================================
           КОНФИГУРАЦИЯ ЭЛЕМЕНТОВ
           ========================================================================= */
        const ELEMENT_TYPES = [
            { level: 0, radius: 18, color: '#38bdf8', icon: '💧', name: 'Капля', score: 2 },
            { level: 1, radius: 26, color: '#f97316', icon: '🔥', name: 'Огонек', score: 4 },
            { level: 2, radius: 36, color: '#4ade80', icon: '🌱', name: 'Росток', score: 8 },
            { level: 3, radius: 46, color: '#facc15', icon: '⚡', name: 'Молния', score: 16 },
            { level: 4, radius: 58, color: '#ec4899', icon: '🌋', name: 'Магма', score: 32 },
            { level: 5, radius: 70, color: '#a855f7', icon: '💎', name: 'Кристалл', score: 64 },
            { level: 6, radius: 84, color: '#6366f1', icon: '⭐', name: 'Звезда', score: 128 },
            { level: 7, radius: 98, color: '#eab308', icon: '☀️', name: 'Солнце', score: 256 },
            { level: 8, radius: 114, color: '#14b8a6', icon: '🌌', name: 'Эфир', score: 512 }
        ];

        /* =========================================================================
           ОСНОВНОЙ ИГРОВОЙ ДВИЖОК
           ========================================================================= */
        const { Engine, Render, Runner, Bodies, Composite, Body, Events, Vector } = Matter;

        let engine, runner;
        let canvas, ctx;
        let width, height;

        // Игровое состояние
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('element_tower_best') || '0');
        let currentElementIndex = 0;
        let nextElementIndex = 0;
        let currentX = 0;
        let canDrop = true;
        let gameOver = false;
        let comboCount = 0;
        let lastMergeTime = 0;

        // Бустеры
        let boosters = { bomb: 1, shake: 1, swap: 2 };
        let activeBoosterMode = null; // 'bomb'

        // Таймер переполнения
        let overflowStartTime = null;
        const OVERFLOW_LIMIT_MS = 2500; // 2.5 секунды на опасной линии

        // Частицы
        let particles = [];

        // Интеграция с Яндекс Играми
        let ysdk = null;

        window.addEventListener('DOMContentLoaded', () => {
            initYandexSDK();
            initGame();
        });

        /* =========================================================================
           ИНТЕГРАЦИЯ С ЯНДЕКС ИГРАМИ
           ========================================================================= */
        function initYandexSDK() {
            if (typeof YaGames !== 'undefined') {
                YaGames.init().then(_ysdk => {
                    ysdk = _ysdk;
                    console.log('Yandex Games SDK инициализирован');
                    // Загрузка рекорда из облака Yandex
                    ysdk.getPlayer().then(player => {
                        player.getData(['bestScore']).then(data => {
                            if (data.bestScore && data.bestScore > bestScore) {
                                bestScore = data.bestScore;
                                updateScoreUI();
                            }
                        });
                    }).catch(() => {});
                });
            }
        }

        function saveBestScore(val) {
            localStorage.setItem('element_tower_best', val.toString());
            if (ysdk) {
                ysdk.getPlayer().then(player => {
                    player.setData({ bestScore: val });
                }).catch(() => {});
            }
        }

        /* =========================================================================
           ИНИЦИАЛИЗАЦИЯ ИГРЫ И ХОЛСТА
           ========================================================================= */
        function initGame() {
            const container = document.getElementById('canvas-container');
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');

            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width;
            canvas.height = height;

            currentX = width / 2;

            // Физический движок
            engine = Engine.create({
                gravity: { x: 0, y: 1.2 }
            });

            // Создаем стены стакана
            const wallOptions = { isStatic: true, friction: 0.2, restitution: 0.3 };
            const wallThickness = 60;

            const leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height * 2, wallOptions);
            const rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 2, wallOptions);
            const ground = Bodies.rectangle(width / 2, height + wallThickness / 2, width * 2, wallThickness, wallOptions);

            Composite.add(engine.world, [leftWall, rightWall, ground]);

            // Запуск физического цикла
            runner = Runner.create();
            Runner.run(runner, engine);

            // Регистрация столкновений для слияния
            Events.on(engine, 'collisionStart', handleCollisions);

            // Генерация первых шаров
            currentElementIndex = getRandomStartLevel();
            nextElementIndex = getRandomStartLevel();

            // Слушатели событий ввода
            setupInputHandlers();

            // Построение UI дерева эволюции
            buildEvolutionUI();
            updateScoreUI();
            updateNextPreview();
            updateBoosterBadges();

            // Главный цикл отрисовки Canvas
            requestAnimationFrame(renderLoop);
        }

        function getRandomStartLevel() {
            // Первые 3 уровня стихий падают случайно
            return Math.floor(Math.random() * 3);
        }

        /* =========================================================================
           УПРАВЛЕНИЕ И ИНТЕРАКТИВ
           ========================================================================= */
        function setupInputHandlers() {
            const container = document.getElementById('canvas-container');

            const handleMove = (e) => {
                if (gameOver) return;
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const relX = clientX - rect.left;
                
                const radius = ELEMENT_TYPES[currentElementIndex].radius;
                currentX = Math.max(radius + 10, Math.min(width - radius - 10, relX));
            };

            const handleRelease = () => {
                if (gameOver || !canDrop) return;

                if (activeBoosterMode === 'bomb') {
                    // Используем бустер Взрыва
                    triggerBombAt(currentX, 100);
                    activeBoosterMode = null;
                    container.style.cursor = 'default';
                    return;
                }

                dropElement();
            };

            container.addEventListener('mousemove', handleMove);
            container.addEventListener('touchmove', handleMove, { passive: true });
            container.addEventListener('mouseup', handleRelease);
            container.addEventListener('touchend', handleRelease);

            // Кнопки интерфейса
            document.getElementById('sound-btn').addEventListener('click', toggleSound);
            document.getElementById('info-btn').addEventListener('click', () => {
                document.getElementById('info-modal').classList.remove('hidden');
            });
            document.getElementById('close-info-btn').addEventListener('click', () => {
                document.getElementById('info-modal').classList.add('hidden');
            });

            document.getElementById('restart-btn').addEventListener('click', restartGame);
            document.getElementById('revive-btn').addEventListener('click', watchRewardAd);

            // Кнопки бустеров
            document.getElementById('booster-bomb').addEventListener('click', useBombBooster);
            document.getElementById('booster-shake').addEventListener('click', useShakeBooster);
            document.getElementById('booster-swap').addEventListener('click', useSwapBooster);
        }

        function toggleSound() {
            audio.muted = !audio.muted;
            document.getElementById('sound-icon-on').classList.toggle('hidden', audio.muted);
            document.getElementById('sound-icon-off').classList.toggle('hidden', !audio.muted);
        }

        /* =========================================================================
           СПАВН И СЛИЯНИЕ ЭЛЕМЕНТОВ
           ========================================================================= */
        function dropElement() {
            canDrop = false;

            const elemData = ELEMENT_TYPES[currentElementIndex];
            const body = Bodies.circle(currentX, 60, elemData.radius, {
                restitution: 0.2,
                friction: 0.1,
                density: 0.002,
                label: 'element',
                elementLevel: currentElementIndex
            });

            Composite.add(engine.world, body);
            audio.playPop(currentElementIndex);

            // Подготовка следующего шара
            currentElementIndex = nextElementIndex;
            nextElementIndex = getRandomStartLevel();

            updateNextPreview();

            setTimeout(() => {
                canDrop = true;
            }, 500);
        }

        function handleCollisions(event) {
            const pairs = event.pairs;

            for (let i = 0; i < pairs.length; i++) {
                const { bodyA, bodyB } = pairs[i];

                if (bodyA.label === 'element' && bodyB.label === 'element') {
                    if (bodyA.elementLevel === bodyB.elementLevel && !bodyA.isMerging && !bodyB.isMerging) {
                        const level = bodyA.elementLevel;

                        // Предотвращение двойного срабатывания
                        bodyA.isMerging = true;
                        bodyB.isMerging = true;

                        mergeElements(bodyA, bodyB, level);
                    }
                }
            }
        }

        function mergeElements(bodyA, bodyB, level) {
            const nextLevel = level + 1;

            // Координаты центра слияния
            const midX = (bodyA.position.x + bodyB.position.x) / 2;
            const midY = (bodyA.position.y + bodyB.position.y) / 2;

            // Удаляем старые физические тела
            Composite.remove(engine.world, bodyA);
            Composite.remove(engine.world, bodyB);

            // Эффекты: частицы, звук, shake
            createMergeParticles(midX, midY, ELEMENT_TYPES[level].color);
            audio.playMerge(level);
            triggerScreenShake();

            // Подсчет Комбо
            const now = Date.now();
            if (now - lastMergeTime < 1200) {
                comboCount++;
            } else {
                comboCount = 1;
            }
            lastMergeTime = now;

            if (comboCount > 1) {
                showComboUI(comboCount);
            }

            // Начисление очков
            const addedScore = ELEMENT_TYPES[level].score * comboCount;
            score += addedScore;
            if (score > bestScore) {
                bestScore = score;
                saveBestScore(bestScore);
            }
            updateScoreUI();
            showScorePopup(midX, midY, `+${addedScore}`);

            // Создаем элемент следующего уровня (если не макс)
            if (nextLevel < ELEMENT_TYPES.length) {
                const nextElemData = ELEMENT_TYPES[nextLevel];
                const newBody = Bodies.circle(midX, midY, nextElemData.radius, {
                    restitution: 0.3,
                    friction: 0.1,
                    density: 0.002,
                    label: 'element',
                    elementLevel: nextLevel
                });

                Composite.add(engine.world, newBody);
            }
        }

        /* =========================================================================
           ВИЗУАЛЬНЫЕ ЭФФЕКТЫ И ЧАСТИЦЫ
           ========================================================================= */
        function createMergeParticles(x, y, color) {
            const count = 18;
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random();
                const speed = 2 + Math.random() * 6;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 4,
                    color: color,
                    alpha: 1,
                    life: 1
                });
            }
        }

        function triggerScreenShake() {
            const app = document.getElementById('game-app');
            app.classList.remove('shake');
            void app.offsetWidth; // HACK trigger reflow
            app.classList.add('shake');
        }

        function showScorePopup(x, y, text) {
            const container = document.getElementById('canvas-container');
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.innerText = text;
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            container.appendChild(popup);

            setTimeout(() => popup.remove(), 800);
        }

        function showComboUI(count) {
            const comboEl = document.getElementById('combo-display');
            document.getElementById('combo-count').innerText = count;
            comboEl.style.opacity = '1';

            clearTimeout(window.comboTimer);
            window.comboTimer = setTimeout(() => {
                comboEl.style.opacity = '0';
            }, 1000);
        }

        /* =========================================================================
           СИСТЕМА БУСТЕРОВ
           ========================================================================= */
        function useBombBooster() {
            if (boosters.bomb <= 0 || gameOver) return;
            boosters.bomb--;
            updateBoosterBadges();

            activeBoosterMode = 'bomb';
            document.getElementById('canvas-container').style.cursor = 'crosshair';
            showScorePopup(width / 2, height / 3, 'Нажмите на экран для Взрыва!');
        }

        function triggerBombAt(x, y) {
            audio.playExplode();
            triggerScreenShake();
            createMergeParticles(x, y, '#ef4444');

            // Находим и уничтожаем тела в радиусе
            const bodies = Composite.allBodies(engine.world);
            const bombRadius = 130;

            bodies.forEach(body => {
                if (body.label === 'element') {
                    const dist = Vector.magnitude(Vector.sub(body.position, { x: x, y: y }));
                    if (dist < bombRadius) {
                        createMergeParticles(body.position.x, body.position.y, ELEMENT_TYPES[body.elementLevel].color);
                        Composite.remove(engine.world, body);
                    }
                }
            });
        }

        function useShakeBooster() {
            if (boosters.shake <= 0 || gameOver) return;
            boosters.shake--;
            updateBoosterBadges();

            audio.playExplode();
            triggerScreenShake();

            const bodies = Composite.allBodies(engine.world);
            bodies.forEach(body => {
                if (body.label === 'element') {
                    Body.applyForce(body, body.position, {
                        x: (Math.random() - 0.5) * 0.08,
                        y: -0.08
                    });
                }
            });
        }

        function useSwapBooster() {
            if (boosters.swap <= 0 || gameOver) return;
            boosters.swap--;
            updateBoosterBadges();

            currentElementIndex = getRandomStartLevel();
            updateNextPreview();
            audio.playPop(1);
        }

        function updateBoosterBadges() {
            document.getElementById('badge-bomb').innerText = boosters.bomb;
            document.getElementById('badge-shake').innerText = boosters.shake;
            document.getElementById('badge-swap').innerText = boosters.swap;
        }

        /* =========================================================================
           ОТРИСОВКА И ЛОГИКА ПЕРЕПОЛНЕНИЯ (RENDER LOOP)
           ========================================================================= */
        function renderLoop() {
            ctx.clearRect(0, 0, width, height);

            // 1. Отрисовка траектории/прицела текущего шара
            if (canDrop && !gameOver) {
                const elemData = ELEMENT_TYPES[currentElementIndex];

                // Пунктирная линия сброса
                ctx.beginPath();
                ctx.setLineDash([6, 6]);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.moveTo(currentX, 60);
                ctx.lineTo(currentX, height - 20);
                ctx.stroke();
                ctx.setLineDash([]);

                // Призрачный шар сверху
                drawElementCircle(ctx, currentX, 60, elemData, 0.85);
            }

            // 2. Отрисовка всех физических элементов
            const bodies = Composite.allBodies(engine.world);
            let isOverflowing = false;
            const dangerY = 90;

            bodies.forEach(body => {
                if (body.label === 'element') {
                    const elemData = ELEMENT_TYPES[body.elementLevel];
                    drawElementCircle(ctx, body.position.x, body.position.y, elemData, 1.0, body.angle);

                    // Проверка линии переполнения (если шар замер выше линии)
                    if (body.position.y - elemData.radius < dangerY && Math.abs(body.velocity.y) < 0.2) {
                        isOverflowing = true;
                    }
                }
            });

            // 3. Обработка линии опасности и таймера
            const dangerLineEl = document.getElementById('danger-line');
            if (isOverflowing && !gameOver) {
                dangerLineEl.classList.remove('hidden');

                if (!overflowStartTime) {
                    overflowStartTime = Date.now();
                } else if (Date.now() - overflowStartTime > OVERFLOW_LIMIT_MS) {
                    triggerGameOver();
                }
            } else {
                overflowStartTime = null;
                dangerLineEl.classList.add('hidden');
            }

            // 4. Отрисовка частиц
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            requestAnimationFrame(renderLoop);
        }

        function drawElementCircle(ctx, x, y, elemData, alpha = 1.0, angle = 0) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.globalAlpha = alpha;

            // Внешнее свечение
            ctx.shadowColor = elemData.color;
            ctx.shadowBlur = 12;

            // Основная сфера
            ctx.beginPath();
            ctx.arc(0, 0, elemData.radius, 0, Math.PI * 2);
            ctx.fillStyle = elemData.color;
            ctx.fill();

            // Блик на сфере (эффект 3D)
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(-elemData.radius * 0.3, -elemData.radius * 0.3, elemData.radius * 0.25, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.fill();

            // Иконка стихии
            ctx.font = `${elemData.radius * 1.1}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(elemData.icon, 0, 2);

            ctx.restore();
        }

        /* =========================================================================
           ОБНОВЛЕНИЕ ИНТЕРФЕЙСА (UI)
           ========================================================================= */
        function updateScoreUI() {
            document.getElementById('score-text').innerText = score;
            document.getElementById('best-score-text').innerText = bestScore;
        }

        function updateNextPreview() {
            const previewContainer = document.getElementById('next-ball-preview');
            const elemData = ELEMENT_TYPES[nextElementIndex];
            previewContainer.innerHTML = `
                <div class="w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-md transition-all scale-110" style="background-color: ${elemData.color};">
                    ${elemData.icon}
                </div>
            `;
        }

        function buildEvolutionUI() {
            const container = document.getElementById('evolution-list');
            container.innerHTML = ELEMENT_TYPES.map(item => `
                <div class="flex items-center justify-between bg-white/5 p-2 rounded-xl border border-white/10">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-lg shadow" style="background-color: ${item.color}">
                            ${item.icon}
                        </div>
                        <span class="font-bold text-sm text-gray-200">${item.name}</span>
                    </div>
                    <span class="text-xs text-yellow-400 font-game">+${item.score} очков</span>
                </div>
            `).join('');
        }

        function triggerGameOver() {
            gameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-best-score').innerText = bestScore;
            document.getElementById('game-over-modal').classList.remove('hidden');
        }

        function restartGame() {
            // Очищаем физический мир от сфер
            const bodies = Composite.allBodies(engine.world);
            bodies.forEach(body => {
                if (body.label === 'element') {
                    Composite.remove(engine.world, body);
                }
            });

            score = 0;
            gameOver = false;
            canDrop = true;
            overflowStartTime = null;

            updateScoreUI();
            document.getElementById('game-over-modal').classList.add('hidden');
        }

        function watchRewardAd() {
            if (ysdk) {
                ysdk.adv.showRewardedVideo({
                    callbacks: {
                        onRewarded: () => {
                            boosters.bomb += 2;
                            updateBoosterBadges();
                            restartGame();
                        }
                    }
                });
            } else {
                // Симуляция в локальном режиме
                alert('Реклама успешно просмотрена! Получено +2 Бомбы.');
                boosters.bomb += 2;
                updateBoosterBadges();
                restartGame();
            }
        }
    </script>
</body>
